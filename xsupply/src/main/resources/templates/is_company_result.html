<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${subject}">Verification Result</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f8fafc; font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;">
<!-- Wrapper principal pour meilleure compatibilité -->
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f8fafc;">
    <tr>
        <td align="center" style="padding: 20px 0;">
            <!-- Container principal -->
            <table width="600" cellpadding="0" cellspacing="0" border="0" style="background-color: #ffffff; border-radius: 24px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); max-width: 600px; margin: 0 auto;">
                <tr>
                    <td style="padding: 40px;">
                        <!-- Header avec logo -->
                        <table width="100%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td align="center" style="padding-bottom: 32px; border-bottom: 1px solid #e2e8f0;">
                                    <img src="cid:xsupplyLogo" alt="XsupplY Logo" style="max-width: 180px; height: auto;">
                                </td>
                            </tr>
                        </table>

                        <!-- Greeting -->
                        <table width="100%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td style="padding: 32px 0 24px 0;">
                                    <h1 style="margin: 0; font-size: 24px; color: #1e293b; font-weight: 600;">Hello <span th:text="${username}">User</span>,</h1>
                                </td>
                            </tr>
                        </table>

                        <!-- Content -->
<!--                        <table width="100%" cellpadding="0" cellspacing="0" border="0">-->
<!--                            <tr>-->
<!--                                <td style="color: #475569; line-height: 24px; padding-bottom: 32px;">-->
<!--                                    <p style="margin: 0;" th:text="${message}">Your account verification status has been updated.</p>-->
<!--                                </td>-->
<!--                            </tr>-->
<!--                        </table>-->

                        <!-- Verification Status -->
                        <table width="100%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td style="padding-bottom: 32px;">
                                    <p style="margin: 0; color: #475569;" th:if="${isCompany}">Your account is now treated as a Company Account.</p>
                                    <p style="margin: 0; color: #475569;" th:unless="${isCompany}">Your account is treated as a normal user account.</p>
                                </td>
                            </tr>
                        </table>

                        <!-- Afficher l'URL de connexion uniquement si l'utilisateur est vérifié -->
                        <table width="100%" cellpadding="0" cellspacing="0" border="0" th:if="${isCompany}">
                            <tr>
                                <td align="center" style="padding: 32px 0;">
                                    <table border="0" cellspacing="0" cellpadding="0">
                                        <tr>
                                            <td align="center" style="border-radius: 32px;" bgcolor="#1966FF">
                                                <a th:href="${loginUrl}" style="padding: 16px 32px; color: #ffffff; font-size: 16px; font-weight: 500; text-decoration: none; display: inline-block; border-radius: 32px; background-color: #1966FF;">
                                                    Login to Your Account →
                                                </a>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>

                        <!-- Footer -->
                        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="border-top: 1px solid #e2e8f0;">
                            <tr>
                                <td align="center" style="padding-top: 32px;">
                                    <p style="margin: 0; color: #64748b; font-size: 14px;">Need help? Contact our support team at support@xsupply.com</p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
