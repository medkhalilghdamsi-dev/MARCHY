name: Frontend quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Report dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); for (const [name, issue] of Object.entries(a.vulnerabilities || {})) console.log(name + ': ' + issue.severity + ', fix available: ' + JSON.stringify(issue.fixAvailable))"
      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: marchy-dependency-audit
          path: npm-audit.json

  browser-regression:
    name: Responsive browser regression
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload failure screenshots and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marchy-browser-failures
          path: test-results/
          if-no-files-found: ignore
