name: Frontend quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Build, audit and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser and accessibility tests
        run: npm run test:e2e
      - name: Report dependency advisories
        if: always()
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); for (const [name, issue] of Object.entries(a.vulnerabilities || {})) console.log(name + ': ' + issue.severity + ', fix available: ' + JSON.stringify(issue.fixAvailable))"
      - name: Upload test and dependency reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marchy-frontend-quality-reports
          path: |
            test-results/
            npm-audit.json
          if-no-files-found: ignore
