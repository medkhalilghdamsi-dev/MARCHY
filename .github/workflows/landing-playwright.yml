name: MARCHY landing Playwright QA

on:
  push:
    branches: [khalil]
    paths:
      - 'src/pages/buyer/HomePage.jsx'
      - 'src/styles/**'
      - '.github/workflows/landing-playwright.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marchy-landing-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out khalil
        uses: actions/checkout@v4
        with:
          ref: khalil
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        run: npm run build
      - name: Capture and inspect deployed landing page
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';

          const baseURL = 'https://marchy-khalil.onrender.com/';
          const browser = await chromium.launch({ headless: true });
          const viewports = [
            ['desktop', { width: 1440, height: 1000 }],
            ['tablet', { width: 768, height: 1024 }],
            ['mobile', { width: 390, height: 844 }],
          ];

          const readinessPage = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          await readinessPage.goto(baseURL, { waitUntil: 'domcontentloaded', timeout: 30000 });
          await readinessPage.locator('#market-hero-title').waitFor({ state: 'visible', timeout: 30000 });
          await readinessPage.waitForFunction(
            () => document.querySelector('#market-hero-title')?.innerText.includes('Discover better.'),
            { timeout: 15000 },
          );
          await readinessPage.close();

          for (const [name, viewport] of viewports) {
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            await page.goto(baseURL, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.locator('#market-hero-title').waitFor({ state: 'visible' });
            await page.locator('.hero-search-form').waitFor({ state: 'visible' });

            const layout = await page.evaluate(() => {
              const rect = selector => {
                const element = document.querySelector(selector);
                if (!element) return null;
                const box = element.getBoundingClientRect();
                return { left: box.left, right: box.right, top: box.top, bottom: box.bottom, width: box.width, height: box.height };
              };
              const hero = rect('.market-hero');
              const heading = rect('#market-hero-title');
              const search = rect('.hero-search-form');
              const trust = rect('.home-trust-rail');
              const intersects = (a, b) => Boolean(a && b && a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top);
              return {
                viewportWidth: document.documentElement.clientWidth,
                documentWidth: document.documentElement.scrollWidth,
                hero, heading, search, trust,
                headingSearchOverlap: intersects(heading, search),
                searchTrustOverlap: intersects(search, trust),
                searchInsideHero: Boolean(hero && search && search.left >= hero.left - 1 && search.right <= hero.right + 1),
              };
            });

            if (layout.documentWidth > layout.viewportWidth + 1) {
              throw new Error(`${name}: horizontal overflow: ${JSON.stringify(layout)}`);
            }
            if (layout.headingSearchOverlap || layout.searchTrustOverlap || !layout.searchInsideHero) {
              throw new Error(`${name}: landing search layout collision: ${JSON.stringify(layout)}`);
            }
            if (pageErrors.length) throw new Error(`${name}: browser errors: ${pageErrors.join('; ')}`);

            await page.screenshot({ path: `artifacts/landing-${name}.png`, fullPage: true, animations: 'disabled' });
            console.log(`${name} PASS ${JSON.stringify(layout)}`);
            await page.close();
          }

          await browser.close();
          NODE
      - name: Upload Playwright report and landing screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marchy-landing-playwright
          path: |
            playwright-report/
            test-results/
            artifacts/
          if-no-files-found: warn
          retention-days: 7
