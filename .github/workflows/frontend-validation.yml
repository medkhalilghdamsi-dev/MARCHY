name: Frontend validation

on:
  push:
    branches:
      - khalil
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marchy-frontend-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, CSS audit and buyer journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Audit CSS ownership
        run: npm run audit:css

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run buyer and responsive regression tests
        run: npm run test:e2e
